<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b14">
  <title>Elvas Interativa</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #060b14;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    #viewer {
      position: relative;
      width: min(100vw, 540px);
      min-height: 100dvh;
      background: #060b14;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    #page-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #060b14;
    }
    #links {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .pdf-link {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(255,255,255,.08);
    }
    #loading, #error {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(8, 15, 27, .86);
      color: #fff;
      font-size: 13px;
      line-height: 1.2;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #error {
      display: none;
      max-width: min(86vw, 420px);
      border-radius: 14px;
      text-align: center;
      line-height: 1.4;
    }
    #back {
      position: fixed;
      z-index: 20;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(8, 15, 27, .72);
      color: white;
      font-size: 22px;
      line-height: 38px;
      text-align: center;
      display: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }
    @media (min-width: 541px) {
      #viewer {
        box-shadow: 0 0 60px rgba(0,0,0,.35);
      }
    }
  </style>
</head>
<body>
  <button id="back" aria-label="Voltar">‹</button>
  <div id="viewer">
    <div id="page-wrap">
      <canvas id="pdf-canvas"></canvas>
      <div id="links"></div>
    </div>
  </div>
  <div id="loading">A carregar…</div>
  <div id="error"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (() => {
      const PDF_URL = "/Elvas_Interativa.pdf";
      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const linksLayer = document.getElementById("links");
      const pageWrap = document.getElementById("page-wrap");
      const loading = document.getElementById("loading");
      const errorBox = document.getElementById("error");
      const backBtn = document.getElementById("back");

      let pdfDoc = null;
      let currentPage = 1;
      let renderToken = 0;
      let navigationStack = [];
      let resizeTimer = null;

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      function showError(message) {
        loading.style.display = "none";
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      function pageFromHash() {
        const m = location.hash.match(/page=(\d+)/i);
        if (!m) return 1;
        const n = parseInt(m[1], 10);
        return Number.isFinite(n) && n > 0 ? n : 1;
      }

      function setHash(pageNum, replace = false) {
        const url = "#page=" + pageNum;
        if (replace) history.replaceState({page: pageNum}, "", url);
        else history.pushState({page: pageNum}, "", url);
      }

      async function resolveDestination(dest) {
        try {
          let explicitDest = dest;
          if (typeof dest === "string") {
            explicitDest = await pdfDoc.getDestination(dest);
          }
          if (!explicitDest || !explicitDest[0]) return null;

          const ref = explicitDest[0];
          if (typeof ref === "object") {
            const index = await pdfDoc.getPageIndex(ref);
            return index + 1;
          }
          if (Number.isInteger(ref)) return ref + 1;
        } catch (_) {}
        return null;
      }

      function externalHref(annotation) {
        return annotation.url || annotation.unsafeUrl || null;
      }

      async function buildLinks(page, viewport) {
        linksLayer.innerHTML = "";
        const annotations = await page.getAnnotations({ intent: "display" });

        for (const ann of annotations) {
          if (ann.subtype !== "Link" || !ann.rect) continue;

          const rect = viewport.convertToViewportRectangle(ann.rect);
          const left = Math.min(rect[0], rect[2]);
          const top = Math.min(rect[1], rect[3]);
          const width = Math.abs(rect[0] - rect[2]);
          const height = Math.abs(rect[1] - rect[3]);

          const hit = document.createElement("a");
          hit.className = "pdf-link";
          hit.style.left = left + "px";
          hit.style.top = top + "px";
          hit.style.width = Math.max(width, 1) + "px";
          hit.style.height = Math.max(height, 1) + "px";
          hit.setAttribute("aria-label", "Abrir");

          const href = externalHref(ann);

          if (href) {
            hit.href = href;
            hit.target = "_blank";
            hit.rel = "noopener noreferrer";
          } else if (ann.dest) {
            hit.href = "#";
            hit.addEventListener("click", async (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              const targetPage = await resolveDestination(ann.dest);
              if (targetPage) navigateTo(targetPage, true);
            });
          } else {
            continue;
          }

          linksLayer.appendChild(hit);
        }
      }

      async function renderPage(pageNum, updateHistory = false) {
        if (!pdfDoc) return;
        pageNum = Math.max(1, Math.min(pdfDoc.numPages, pageNum));
        const token = ++renderToken;
        loading.style.display = "block";
        errorBox.style.display = "none";

        try {
          const page = await pdfDoc.getPage(pageNum);
          if (token !== renderToken) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const cssWidth = Math.min(window.innerWidth, 540);
          const cssScale = cssWidth / baseViewport.width;
          const viewport = page.getViewport({ scale: cssScale });

          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width = viewport.width + "px";
          canvas.style.height = viewport.height + "px";

          pageWrap.style.width = viewport.width + "px";
          pageWrap.style.height = viewport.height + "px";
          linksLayer.style.width = viewport.width + "px";
          linksLayer.style.height = viewport.height + "px";

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          await page.render({
            canvasContext: ctx,
            viewport: viewport,
            background: "#060b14"
          }).promise;

          if (token !== renderToken) return;
          await buildLinks(page, viewport);

          currentPage = pageNum;
          backBtn.style.display = navigationStack.length ? "block" : "none";

          if (updateHistory) setHash(pageNum);
          else if (!location.hash) setHash(pageNum, true);

          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
          loading.style.display = "none";
        } catch (err) {
          console.error(err);
          showError("Não foi possível abrir o guia. Atualize a página e tente novamente.");
        }
      }

      function navigateTo(pageNum, remember) {
        if (remember && pageNum !== currentPage) navigationStack.push(currentPage);
        renderPage(pageNum, true);
      }

      backBtn.addEventListener("click", () => {
        const previous = navigationStack.pop();
        if (previous) renderPage(previous, true);
        backBtn.style.display = navigationStack.length ? "block" : "none";
      });

      window.addEventListener("popstate", () => {
        const p = pageFromHash();
        navigationStack = [];
        renderPage(p, false);
      });

      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderPage(currentPage, false), 180);
      });

      async function init() {
        try {
          const task = pdfjsLib.getDocument({
            url: PDF_URL,
            cMapPacked: true,
            useSystemFonts: true
          });
          pdfDoc = await task.promise;
          const initial = Math.min(pageFromHash(), pdfDoc.numPages);
          await renderPage(initial, false);
        } catch (err) {
          console.error(err);
          showError("Não foi possível carregar o Elvas Interativa.");
        }
      }

      init();
    })();
  </script>
</body>
</html>
